name: worldscope

# Development mode: `docker compose up -d postgres redis` starts only the data
# services; run the API and web client on the host with `pnpm dev`.
# Full mode: `docker compose up -d --build` starts every service in containers.

x-api-environment: &api-environment
  NODE_ENV: production
  API_PORT: 3000
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
  DATABASE_URL: postgresql://${POSTGRES_USER:-worldscope}:${POSTGRES_PASSWORD:-worldscope_dev}@postgres:5432/${POSTGRES_DB:-worldscope}?schema=public
  REDIS_URL: redis://redis:6379
  COUNTRY_CATALOG_BASE_URL: ${COUNTRY_CATALOG_BASE_URL:-https://raw.githubusercontent.com/mledoze/countries/5d15c0ff8c87ef2f1f8e944093522d4b2de2dd5b}
  FLAG_CDN_BASE_URL: ${FLAG_CDN_BASE_URL:-https://flagcdn.com}
  WORLD_BANK_BASE_URL: ${WORLD_BANK_BASE_URL:-https://api.worldbank.org/v2}
  OPEN_METEO_BASE_URL: ${OPEN_METEO_BASE_URL:-https://api.open-meteo.com/v1}
  HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-8000}
  CACHE_TTL_CATALOG_SECONDS: ${CACHE_TTL_CATALOG_SECONDS:-86400}
  CACHE_TTL_INDICATORS_SECONDS: ${CACHE_TTL_INDICATORS_SECONDS:-86400}
  CACHE_TTL_WEATHER_SECONDS: ${CACHE_TTL_WEATHER_SECONDS:-1800}
  RATE_LIMIT_TTL_SECONDS: ${RATE_LIMIT_TTL_SECONDS:-60}
  RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-120}

services:
  postgres:
    image: postgres:17.12-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worldscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worldscope_dev}
      POSTGRES_DB: ${POSTGRES_DB:-worldscope}
    ports:
      # Bound to loopback: never reachable from the local network.
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - worldscope

  redis:
    image: redis:8.8.4-alpine3.23
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - worldscope

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      <<: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Applies pending migrations before serving traffic. Safe to re-run.
    command: ['sh', '-c', './node_modules/.bin/prisma migrate deploy && node dist/main.js']
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/v1/health/live >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - worldscope

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_CONTAINER_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - worldscope

volumes:
  postgres-data:
  redis-data:

networks:
  worldscope:
    driver: bridge
